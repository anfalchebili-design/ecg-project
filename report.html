<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ECG Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white min-h-screen flex justify-center items-center py-10">

<button onclick="goBack()" 
class="absolute top-5 left-5 bg-white/10 px-3 py-1.5 rounded hover:bg-white/20 text-sm transition">
    ← Back
</button>

<div class="bg-white/5 p-6 rounded-xl w-[650px] space-y-4 border border-white/10">

    <h2 class="text-xl text-center text-red-400 font-semibold">ECG Medical Report ❤️</h2>

    <div class="border-b border-white/10 pb-3 text-xs text-gray-400 flex justify-between">
        <div>
            <p>🏥 Hospital: <span id="repDocHospital" class="text-white font-medium">---</span></p>
            <p>🩺 Issued by: <span id="repDocName" class="text-white font-medium">---</span></p>
        </div>
        <div class="text-right">
            <p>📋 Patient Age: <span id="repPatientAge" class="text-white font-medium">---</span></p>
            <p>🔍 History: <span id="repPatientDisease" class="text-yellow-400/80 font-medium">---</span></p>
        </div>
    </div>

    <div class="space-y-1">
        <h3 class="text-xs text-gray-400 font-bold">Analyzed Waveform:</h3>
        <div class="w-full h-44 bg-black rounded border border-white/10 overflow-hidden flex items-center justify-center">
            <img id="repEcgImage" class="w-full h-full object-cover hidden" alt="Analyzed ECG">
            <p id="noRepImageText" class="text-xs text-gray-500">No ECG waveform found</p>
        </div>
    </div>

    <hr class="border-white/10">

    <div id="report" class="space-y-3"></div>

</div>

<script>

/* 🔙 BACK → نرجعوها لصفحة الطبيب والـ ECG لقبلها */
function goBack(){
    window.location.href = "doctor.html"; // أو اسم الملف تاعك (doctor-ecg.html)
}

// 📥 DATA (جلب المعطيات الجديدة الخاصة بالمسار تاع الطبيب)
let age = parseInt(localStorage.getItem("doc_patient_age")) || 0;
let disease = localStorage.getItem("doc_patient_disease") || "none";
let docName = localStorage.getItem("doctor_name") || "Cardiologist";
let docHospital = localStorage.getItem("doctor_hospital") || "General Clinic";
let ecgImgData = localStorage.getItem("doctor_ecg_image");

// حقن معلومات الطبيب والمريض الفوق في الهيدر
document.getElementById("repDocName").innerText = docName;
document.getElementById("repDocHospital").innerText = docHospital;
document.getElementById("repPatientAge").innerText = age + " years old";
document.getElementById("repPatientDisease").innerText = disease;

// عرض الصورة المرفوعة
if(ecgImgData) {
    const imgTag = document.getElementById("repEcgImage");
    imgTag.src = ecgImgData;
    imgTag.classList.remove("hidden");
    document.getElementById("noRepImageText").classList.add("hidden");
}

// 🧠 AI LOGIC (اللوجيك العبقري تاعك)
let risk = Math.random() * 40;

if(age > 50) risk += 20;
if(age > 65) risk += 30;
if(disease !== "none") risk += 25;

let finalRisk = Math.min(100, Math.round(risk));

// 📊 RESULT VARIABLES
let statusStr, interpretation, diseases, advice, statusColor;

// 🎯 ANALYSIS
if(finalRisk < 30){
    statusStr = "✅ NORMAL ECG";
    statusColor = "text-green-400";
    interpretation = "Normal sinus rhythm detected with no significant electrical abnormalities.";
    diseases = "No significant heart disease predicted at present.";
    advice = "Maintain healthy lifestyle, regular cardio exercise, and balanced diet.";
}
else if(finalRisk < 60){
    statusStr = "⚠️ BORDERLINE ECG";
    statusColor = "text-orange-400";
    interpretation = "Possible mild irregularities in heart rhythm or waveform conduction.";
    diseases = `Early arrhythmia risk or hypertension-related cardiac stress. ${disease !== 'none' ? '(Prior history of ' + disease + ')' : ''}`;
    advice = "Monitor blood pressure regularly, reduce stress, limit stimulants, and schedule a follow-up ECG.";
}
else{
    statusStr = "❌ ABNORMAL ECG";
    statusColor = "text-red-500";
    interpretation = "Significant abnormal cardiac electrical activity detected. Waveform pattern shows high instability.";
    diseases = `High risk of Arrhythmia, Coronary Artery Disease, or Heart Failure. ${disease !== 'none' ? 'Complicated by ' + disease : ''}`;
    advice = "URGENT: Cardiology consultation and full clinical investigation required immediately.";
}

// 🩺 DOCTOR FEATURES
let doctorTools = `
<div class="bg-blue-500/5 border border-blue-500/20 p-3 rounded-lg mt-4">
    <h4 class="text-blue-400 font-bold text-sm mb-1">🩺 Clinical Insights (Doctor Only):</h4>
    <ul class="list-disc list-inside text-xs text-blue-200/80 space-y-0.5">
        <li>ECG waveform morphology evaluation completed.</li>
        <li>Heart rate variability (HRV) analysis indicates signal anomalies.</li>
        <li>Blood pressure correlation required.</li>
        <li>Troponin / Cardiac biomarker lab test recommended.</li>
        <li>Follow-up 12-lead ECG required within 48 hours.</li>
    </ul>
</div>
`;

// 🖥️ DISPLAY
document.getElementById("report").innerHTML = `
<p class="text-lg font-bold">Status: <span class="${statusColor}">${statusStr}</span></p>
<p class="text-sm"><strong>Risk Score:</strong> <span class="font-semibold text-red-400">${finalRisk}%</span></p>

<div class="text-sm space-y-2 pt-2 text-gray-200">
    <p><strong>Clinical Interpretation:</strong><br><span class="text-gray-300">${interpretation}</span></p>
    <p><strong>Possible Conditions:</strong><br><span class="text-gray-300">${diseases}</span></p>
    <p><strong>Medical Management Advice:</strong><br><span class="text-gray-300">${advice}</span></p>
</div>

${doctorTools}
`;

</script>

</body>
</html>
